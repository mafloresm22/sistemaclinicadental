<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 70 100" width="70" height="100">
  <defs>
    <linearGradient id="root-mol-sup" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#dfd2be" />
      <stop offset="50%" stop-color="#f5ede0" />
      <stop offset="100%" stop-color="#cfbe9f" />
    </linearGradient>
    <linearGradient id="crown-mol-sup" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="55%" stop-color="#f0f5fa" />
      <stop offset="100%" stop-color="#d9e5ee" />
    </linearGradient>
    <filter id="shadow-mol" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-opacity="0.18" />
    </filter>
  </defs>
  <!-- 3 raíces anatómicas del molar superior: mesial, distal y palatina -->
  <path d="M 18 46 C 14 30 13 14 17 6 C 21 16 23 30 26 44 Z" fill="url(#root-mol-sup)" filter="url(#shadow-mol)" stroke="#b8a688" stroke-width="0.8"/>
  <path d="M 52 46 C 56 30 57 14 53 6 C 49 16 47 30 44 44 Z" fill="url(#root-mol-sup)" filter="url(#shadow-mol)" stroke="#b8a688" stroke-width="0.8"/>
  <path d="M 31 44 C 31 28 32 12 35 4 C 38 12 39 28 39 44 Z" fill="url(#root-mol-sup)" filter="url(#shadow-mol)" stroke="#b8a688" stroke-width="0.8"/>
  <!-- Cuello cervical ancho -->
  <path d="M 12 47 C 23 43 47 43 58 47" fill="none" stroke="#e08f8f" stroke-width="1.4" stroke-linecap="round"/>
  <!-- Corona ancha multicuspídea Molar Superior (4 cúspides) -->
  <path d="M 12 47 C 7 58 8 76 13 87 C 17 93 23 95 26 94 C 29 91 32 91 35 93 C 38 91 41 91 44 94 C 47 95 53 93 57 87 C 62 76 63 58 58 47 C 48 44 22 44 12 47 Z" fill="url(#crown-mol-sup)" filter="url(#shadow-mol)" stroke="#adc3d4" stroke-width="1.1"/>
  <!-- Fisuras y surcos oclusales en H / cruz -->
  <path d="M 24 93 C 27 82 28 72 35 70 C 42 72 43 82 46 93" fill="none" stroke="#b4cadb" stroke-width="1.2" stroke-linecap="round"/>
  <path d="M 35 70 L 35 55" stroke="#b4cadb" stroke-width="1.2" stroke-linecap="round"/>
  <!-- Brillos y volumen coronal -->
  <path d="M 16 57 C 12 68 13 79 18 86" stroke="#ffffff" stroke-width="2" stroke-linecap="round" fill="none"/>
  <path d="M 52 57 C 56 68 55 79 50 86" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" fill="none"/>
</svg>
