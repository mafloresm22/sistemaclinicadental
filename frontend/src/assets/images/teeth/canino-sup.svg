<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 60 100" width="60" height="100">
  <defs>
    <linearGradient id="root-can-sup" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#dfd2be" />
      <stop offset="50%" stop-color="#f5ede0" />
      <stop offset="100%" stop-color="#cfbe9f" />
    </linearGradient>
    <linearGradient id="crown-can-sup" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="60%" stop-color="#f0f5fa" />
      <stop offset="100%" stop-color="#d9e5ee" />
    </linearGradient>
    <filter id="shadow-can" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-opacity="0.15" />
    </filter>
  </defs>
  <!-- Raíz larga y robusta del canino superior -->
  <path d="M 23 50 C 19 32 25 10 30 3 C 35 10 41 32 37 50 Z" fill="url(#root-can-sup)" filter="url(#shadow-can)" stroke="#b8a688" stroke-width="0.8"/>
  <path d="M 30 8 C 30 22 31 36 31 47" stroke="#cbb898" stroke-width="0.8" stroke-dasharray="2,2" fill="none"/>
  <!-- Cuello cervical pronunciado -->
  <path d="M 17 50 C 24 47 36 47 43 50" fill="none" stroke="#e08f8f" stroke-width="1.3" stroke-linecap="round"/>
  <!-- Corona con cúspide canina prominente -->
  <path d="M 17 50 C 13 60 13 74 18 85 C 22 92 28 97 30 98 C 32 97 38 92 42 85 C 47 74 47 60 43 50 C 36 48 24 48 17 50 Z" fill="url(#crown-can-sup)" filter="url(#shadow-can)" stroke="#adc3d4" stroke-width="1"/>
  <!-- Vértice y vertientes cuspídeas -->
  <path d="M 30 98 L 30 68" stroke="#bcd0df" stroke-width="1.1" stroke-linecap="round"/>
  <!-- Brillos del canino -->
  <path d="M 20 60 C 17 68 18 80 23 88" stroke="#ffffff" stroke-width="1.8" stroke-linecap="round" fill="none"/>
  <path d="M 37 62 C 40 70 39 80 36 86" stroke="#ffffff" stroke-width="1" stroke-linecap="round" fill="none"/>
</svg>
