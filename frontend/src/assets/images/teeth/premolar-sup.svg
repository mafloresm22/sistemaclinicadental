<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 60 100" width="60" height="100">
  <defs>
    <linearGradient id="root-pre-sup" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#dfd2be" />
      <stop offset="50%" stop-color="#f5ede0" />
      <stop offset="100%" stop-color="#cfbe9f" />
    </linearGradient>
    <linearGradient id="crown-pre-sup" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="60%" stop-color="#f0f5fa" />
      <stop offset="100%" stop-color="#d9e5ee" />
    </linearGradient>
    <filter id="shadow-pre" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-opacity="0.15" />
    </filter>
  </defs>
  <!-- Raíces bífidas del premolar superior -->
  <path d="M 20 48 C 17 35 18 18 22 8 C 24 16 26 28 29 40 C 32 28 34 16 38 8 C 42 18 43 35 40 48 Z" fill="url(#root-pre-sup)" filter="url(#shadow-pre)" stroke="#b8a688" stroke-width="0.8"/>
  <!-- Cuello cervical -->
  <path d="M 15 49 C 23 45 37 45 45 49" fill="none" stroke="#e08f8f" stroke-width="1.3" stroke-linecap="round"/>
  <!-- Corona bicuspídea premolar superior -->
  <path d="M 15 49 C 11 60 11 76 16 86 C 19 92 23 94 25 94 C 28 92 29 90 30 90 C 31 90 32 92 35 94 C 37 94 41 92 44 86 C 49 76 49 60 45 49 C 38 46 22 46 15 49 Z" fill="url(#crown-pre-sup)" filter="url(#shadow-pre)" stroke="#adc3d4" stroke-width="1"/>
  <!-- Surco intercuspídeo -->
  <path d="M 30 90 L 30 65" stroke="#bcd0df" stroke-width="1.1" stroke-linecap="round"/>
  <path d="M 23 72 C 26 69 34 69 37 72" fill="none" stroke="#d2e1ec" stroke-width="0.9"/>
  <!-- Brillos -->
  <path d="M 18 58 C 15 67 16 78 20 84" stroke="#ffffff" stroke-width="1.6" stroke-linecap="round" fill="none"/>
  <path d="M 38 58 C 41 67 40 78 37 84" stroke="#ffffff" stroke-width="1.2" stroke-linecap="round" fill="none"/>
</svg>
