<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 70 100" width="70" height="100">
  <defs>
    <linearGradient id="root-mol-inf" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#dfd2be" />
      <stop offset="50%" stop-color="#f5ede0" />
      <stop offset="100%" stop-color="#cfbe9f" />
    </linearGradient>
    <linearGradient id="crown-mol-inf" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#d9e5ee" />
      <stop offset="45%" stop-color="#f0f5fa" />
      <stop offset="100%" stop-color="#ffffff" />
    </linearGradient>
    <filter id="shadow-mol-inf" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-opacity="0.18" />
    </filter>
  </defs>
  <!-- 2 raíces potentes del molar inferior: mesial y distal hacia abajo -->
  <path d="M 18 54 C 14 70 14 86 18 94 C 22 84 25 70 28 56 Z" fill="url(#root-mol-inf)" filter="url(#shadow-mol-inf)" stroke="#b8a688" stroke-width="0.8"/>
  <path d="M 52 54 C 56 70 56 86 52 94 C 48 84 45 70 42 56 Z" fill="url(#root-mol-inf)" filter="url(#shadow-mol-inf)" stroke="#b8a688" stroke-width="0.8"/>
  <path d="M 28 56 C 31 66 39 66 42 56 Z" fill="#cfbe9f" stroke="#b8a688" stroke-width="0.6"/>
  <!-- Cuello cervical -->
  <path d="M 12 53 C 23 57 47 57 58 53" fill="none" stroke="#e08f8f" stroke-width="1.4" stroke-linecap="round"/>
  <!-- Corona Molar Inferior (cúspides arriba) -->
  <path d="M 12 53 C 7 42 8 24 13 13 C 17 7 23 5 26 6 C 29 9 32 9 35 7 C 38 9 41 9 44 6 C 47 5 53 7 57 13 C 62 24 63 42 58 53 C 48 56 22 56 12 53 Z" fill="url(#crown-mol-inf)" filter="url(#shadow-mol-inf)" stroke="#adc3d4" stroke-width="1.1"/>
  <!-- Surcos oclusales -->
  <path d="M 24 7 C 27 18 28 28 35 30 C 42 28 43 18 46 7" fill="none" stroke="#b4cadb" stroke-width="1.2" stroke-linecap="round"/>
  <path d="M 35 30 L 35 45" stroke="#b4cadb" stroke-width="1.2" stroke-linecap="round"/>
  <!-- Brillos -->
  <path d="M 16 43 C 12 32 13 21 18 14" stroke="#ffffff" stroke-width="2" stroke-linecap="round" fill="none"/>
</svg>
